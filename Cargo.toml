[workspace]
members = ["perf-bench", "perf-callgraph", "perf-viz"]
# `cargo run` / `cargo build` without -p act on the viewer; `--workspace` covers everything.
default-members = ["perf-viz"]
resolver = "3"

[workspace.lints.clippy]
too_many_lines = "warn"

[profile.release]
incremental = true

# Full production build: `cargo build --profile dist` (binaries in target/dist/).
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
