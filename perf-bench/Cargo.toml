[package]
name = "perf-bench"
version = "0.1.0"
edition = "2024"
default-run = "perf-bench"

[lints]
workspace = true

[dependencies]
byteorder = "1.5.0"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.189"
linux-perf-data = "0.13.0"
linux-perf-event-reader = "0.10.2"
memmap2 = "0.9.11"
perf-reader = { path = "../perf-reader" }
